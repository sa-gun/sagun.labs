<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sagun Poudel | Personal Website</title>
    <meta name="description" content="Welcome to my personal website. Explore my interests.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0b0f;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #7c9cff;
        }

        nav a {
            color: #ccc;
            text-decoration: none;
            margin-left: 22px;
        }

        nav a:hover {
            color: #7c9cff;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 80px 8%;
        }

        .hero {
            max-width: 750px;
        }

        .tag {
            color: #7c9cff;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        h1 {
            font-size: clamp(42px, 7vw, 76px);
            margin-bottom: 20px;
        }

        h1 span {
            color: #7c9cff;
        }

        .description {
            color: #aaa;
            font-size: 18px;
            line-height: 1.8;
            max-width: 620px;
        }

        /* ---- Animated line (only this line is styled) ---- */
        .description .traffic-line {
            display: inline-block;
            font-family: 'Poppins', Arial, sans-serif;
            font-weight: 600;
            font-size: clamp(20px, 3.2vw, 28px);
            line-height: 1.5;
            background: linear-gradient(90deg, #ff4d4d, #ffc933, #3ddc84, #ffc933, #ff4d4d);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            opacity: 0;
            transform: translateY(20px);
            animation:
                lineIn 1s ease-out 0.3s forwards,
                trafficFlow 4s linear 1.3s infinite,
                floaty 3s ease-in-out 1.3s infinite;
        }

        @keyframes lineIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes trafficFlow {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .description .traffic-line {
                animation: lineIn 0.01s forwards;
            }
        }

        .links {
            margin-top: 35px;
        }

        .links a {
            display: inline-block;
            padding: 13px 24px;
            margin-right: 12px;
            border: 1px solid #7c9cff;
            border-radius: 6px;
            color: white;
            text-decoration: none;
        }

        .links a:hover {
            background: #7c9cff;
            color: #0b0b0f;
        }

        footer {
            text-align: center;
            padding: 25px;
            border-top: 1px solid #222;
            color: #777;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">SAGUN LABS</div>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <main id="home">
        <section class="hero">
            <p class="tag">WELCOME TO MY DIGITAL SPACE</p>

            <h1>Hi, I'm <span>Sagun Poudel.</span></h1>

            <p class="description" id="about">
                <span class="traffic-line">Traffic Light tinta xa ...k uslai tmro chinta xa??</span>
            </p>

            <div class="links">
                <a href="https://github.com/" target="_blank">GitHub</a>
                <a href="mailto:poudelsagun76@outlook.com">Contact Me</a>
            </div>
        </section>
    </main>

    <footer>
        © 2026 Sagun Poudel. All rights reserved.
    </footer>

</body>
</html>
